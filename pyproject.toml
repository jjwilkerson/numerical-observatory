[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numerical-observatory"
version = "0.1.0"
description = "A small CPU Schwarzschild and Kerr null-geodesic observatory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.11", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=7"]
carpetx = ["openpmd-api>=0.17.1,<0.18"]
acceleration = ["numba>=0.67,<0.68"]

[project.scripts]
numerical-observatory = "numerical_observatory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
numerical_observatory = ["data/*.jpg", "data/*.md", "data/*.csv", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Real evolved CarpetX data from the copied reference, not a Schwarzschild model.
# Path is relative to THIS configuration. Replace with your converted GMDS folder.
[spacetime]
type = "numerical"
dataset = "../../reference/geodesics-cpp/results/amr-composite-multilevel/carpetx-native-gmds"
spatial_interpolation = "cubic_amr_c1_hierarchy"
cache_bytes = 1073741824

[camera]
position = [6.5, 0.23, 0.17]
target = [7.5, 0.23, 0.17]
up = [0.0, 0.0, 1.0]
time = 4.0
fov_degrees = 40.0
width = 24
height = 18
observer = "static"

[integration]
rtol = 1e-10
atol = 1e-12
max_step = 0.06
max_affine = 6.0

[numerical_domain]
# This is an explicit finite-radius direction detector; NOT null infinity.
# No capture surface has been established for this evolved dataset.
background = "finite_direction_sphere"
background_radius = 8.0

[background]
mode = "grid"
